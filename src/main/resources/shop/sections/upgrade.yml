enabled: true

# Border Filler Configuration
filler:
  enabled: true
  border-material: BLACK_STAINED_GLASS_PANE
  empty-material: ORANGE_STAINED_GLASS_PANE

main-menu:
  enabled: true
  slot: 24
  material: ANVIL
  name: "&#FFAA00&lPET UPGRADES & LIMITS"
  lore:
    - "&7Level up your summoned pets with XP"
    - "&7or upgrade your total storage capacity."
    - "&8&m-------------------------------------"
    - "&cRequires owning at least 1 pet."
    - "&b▸ Click to open Upgrades"

title: "&#FFAA00&l« &f&lPET UPGRADES & LIMITS &#FFAA00&l»"
size: 45

items:
  # ==================== SKILLTREE & XP UPGRADES ====================

  'buy_xp_small':
    material: EXPERIENCE_BOTTLE
    slot: 10
    name: "&d&lBuy +1,000 Pet XP"
    lore:
      - "&7Instantly gives 1,000 experience points"
      - "&7to your currently active summoned pet!"
      - "&8&m-------------------------------------"
      - "&7Price: &a500 zGems"
      - "&7Your Balance: &f%excellenteconomy_balance_zgems%"
      - "&8&m-------------------------------------"
      - "&eClick to buy XP!"
    price: 500
    currency: "zGems"
    action: "addxp active 1000"

  'buy_xp_large':
    material: DRAGON_BREATH
    slot: 12
    name: "&5&lBuy +10,000 Pet XP"
