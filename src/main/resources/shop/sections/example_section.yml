# =====================================================================
#          RZXPets - EXAMPLE SECTION CONFIGURATION (REFERENCE)
# =====================================================================
#
# This file is a COMPLETE reference guide explaining every configurable
# option available when creating custom shop/menu sections in RZXPets.
#
# WHAT IS A "SECTION"?
#   A section is a single YAML file inside the shop/sections/ folder
#   that defines one inventory menu screen. Each section can contain
#   buttons, pet purchase items, navigation links, and more.
#
# HOW SECTIONS WORK:
#   When the plugin starts (or on /rzxpets reload), it scans the
#   shop/sections/ folder and loads every .yml file it finds.
#   Each section file defines:
#     - Its own inventory title, size, and border filler
#     - An optional button on the MAIN menu for navigation
#     - A list of clickable items with actions
#
# HOW TO CREATE A NEW SECTION:
#   1. Copy this file and rename it (e.g. "vip_shop.yml").
#   2. The filename (without .yml) becomes the section's ID used in
#      navigation actions. Example: "vip_shop.yml" → ID = "vip_shop"
#   3. Set "enabled: true" to activate it.
#   4. Link it from other menus using: action: "open vip_shop"
#   5. Reload with /rzxpets reload.
#
# SPECIAL SECTIONS:
#   - "main.yml" is the root hub menu opened by /petshop and /pets.
#     It cannot be opened with "open main" from other sections
#     because it dynamically assembles buttons from all other
#     sections' "main-menu" blocks.
#   - "shop.yml" is the default adoption shop opened via the main menu.
#   - "upgrade.yml" is the pet upgrades & storage limits menu.
#
# IMPORTANT: This file is set to "enabled: false" so it will NOT
# appear in any menu. It exists purely as documentation.
#
# =====================================================================


# =====================================================================
# 1. ENABLED TOGGLE
# =====================================================================
# Whether this section is loaded and accessible.
# Set to false to disable without deleting the file.
enabled: false


# =====================================================================
# 2. BORDER FILLER CONFIGURATION
# =====================================================================
# Fills empty inventory slots with decorative glass panes to create
# a polished, premium-looking inventory layout.
#
# Fields:
#   enabled:         (boolean) Whether to render fillers at all.
#   border-material: (Material) Glass pane type for outer edge slots.
#   empty-material:  (Material) Glass pane type for unused inner slots.
#
# Supported materials (glass panes):
#   BLACK_STAINED_GLASS_PANE, WHITE_STAINED_GLASS_PANE,
#   GRAY_STAINED_GLASS_PANE, LIGHT_GRAY_STAINED_GLASS_PANE,
#   RED_STAINED_GLASS_PANE, ORANGE_STAINED_GLASS_PANE,
#   YELLOW_STAINED_GLASS_PANE, LIME_STAINED_GLASS_PANE,
#   GREEN_STAINED_GLASS_PANE, CYAN_STAINED_GLASS_PANE,
#   LIGHT_BLUE_STAINED_GLASS_PANE, BLUE_STAINED_GLASS_PANE,
#   PURPLE_STAINED_GLASS_PANE, MAGENTA_STAINED_GLASS_PANE,
#   PINK_STAINED_GLASS_PANE, BROWN_STAINED_GLASS_PANE
#   (or any valid Spigot Material name)
# =====================================================================
filler:
  enabled: true
  border-material: BLACK_STAINED_GLASS_PANE
  empty-material: LIGHT_BLUE_STAINED_GLASS_PANE


# =====================================================================
# 3. MAIN MENU BUTTON
# =====================================================================
# Controls whether and how this section appears as a clickable button
# on the central main menu (/petshop → main.yml).
#
# When main-menu.enabled is true, the plugin will automatically
# generate a button on the main menu using the fields below.
# The action is automatically set to "open <this_section_id>".
#
# Fields:
#   enabled:           (boolean) Show button on main menu?
#   slot:              (int) Inventory slot position (0-indexed).
#   material:          (Material) Item type for the button.
#   name:              (string) Display name. Supports & and hex colors.
#   lore:              (list) Description lines. Supports placeholders.
#   custom-model-data: (int) Resource pack model ID. Set 0 for default.
#
# SLOT REFERENCE for a 45-slot inventory (5 rows of 9):
#   Row 1: [0]  [1]  [2]  [3]  [4]  [5]  [6]  [7]  [8]
#   Row 2: [9]  [10] [11] [12] [13] [14] [15] [16] [17]
#   Row 3: [18] [19] [20] [21] [22] [23] [24] [25] [26]
#   Row 4: [27] [28] [29] [30] [31] [32] [33] [34] [35]
#   Row 5: [36] [37] [38] [39] [40] [41] [42] [43] [44]
# =====================================================================
main-menu:
  enabled: true
  slot: 13
  material: NETHER_STAR
  name: "&#FF5500&lEXAMPLE SECTION"
  lore:
    - "&7This is an example section that demonstrates"
    - "&7all available configuration options."
    - "&8&m-------------------------------------"
    - "&b▸ Click to open Example Section"
  custom-model-data: 0


# =====================================================================
# 4. INVENTORY LAYOUT
# =====================================================================
# Defines the inventory window properties for this section.
#
# Fields:
#   title: (string) Inventory window title shown at the top.
#          Supports & color codes, hex codes (&#ffffff), and
#          PlaceholderAPI placeholders (%placeholder%).
#   size:  (int) Number of slots. Must be a multiple of 9.
#          Minimum: 9 (1 row), Maximum: 54 (6 rows).
#          Common values: 27 (3 rows), 36 (4 rows), 45 (5 rows).
# =====================================================================
title: "&#FF5500&l« &f&lEXAMPLE SECTION &#FF5500&l»"
size: 45


# =====================================================================
# 5. ITEMS
# =====================================================================
# The "items" section defines every clickable button/item displayed
# in this inventory. Each key is a unique identifier (any string).
#
# ITEM FIELDS:
# ─────────────────────────────────────────────────────────────────────
#
# material: (required) The Spigot Material name for the item icon.
#   Examples: DIAMOND, EMERALD, PAPER, BARRIER, EXPERIENCE_BOTTLE,
#             BLAZE_SPAWN_EGG, PARROT_SPAWN_EGG, BAT_SPAWN_EGG,
#             NETHER_STAR, CHEST, LEAD, SADDLE, DRAGON_BREATH
#
# slot: (required) The inventory slot to place this item in (0-indexed).
#   See slot reference chart above.
#
# name: (required) The item display name.
#   Supports & color codes and hex codes.
#   Examples: "&a&lGreen Bold Text", "&#FF0000Red Hex Text"
#
# lore: (required) List of description lines shown below the name.
#   Supports & color codes, hex codes, and PlaceholderAPI placeholders.
#   Common placeholders:
#     %player_name%                    → Player's name
#     %excellenteconomy_balance_zgems% → zGems balance
#     %player_level%                   → Player's XP level
#
# price: (required) The numeric cost of clicking this item.
#   Set to 0 for free/navigation items.
#
# currency: (required) How the price is charged. Valid values:
#   "free"  → No cost. Used for navigation buttons.
#   "zGems" → Deducts from ExcellentEconomy zGems balance.
#             Requires ExcellentEconomy plugin with a "zgems" currency.
#   "item"  → Requires physical items in the player's inventory.
#             Must also specify "item-id" (see below).
#
# item-id: (optional, required if currency: "item")
#   Specifies which item to consume from the player's inventory.
#   Format: "vanilla:MATERIAL_NAME"
#   Examples:
#     "vanilla:EMERALD"     → Vanilla emeralds
#     "vanilla:DIAMOND"     → Vanilla diamonds
#     "vanilla:GOLD_INGOT"  → Vanilla gold ingots
#     "vanilla:NETHER_STAR" → Vanilla nether stars
#
# custom-model-data: (optional) Resource pack custom model data.
#   Set to 0 or omit for default textures.
#
# permission: (optional) Permission node required to see/use this item.
#   Leave empty or omit for no restriction.
#
# action: (required) What happens when the player clicks the item.
#   See the ACTION REFERENCE below.
#
# ─────────────────────────────────────────────────────────────────────
#
# ACTION REFERENCE:
# ─────────────────────────────────────────────────────────────────────
#
# "open <section_id>"
#   Opens another section menu by its file ID.
#   Examples:
#     action: "open main"      → Opens the main hub menu
#     action: "open shop"      → Opens shop.yml
#     action: "open upgrade"   → Opens upgrade.yml
#     action: "open vip_shop"  → Opens vip_shop.yml (custom section)
#     action: "open storage"   → Opens the pet storage locker
#
# "buy <pet_id>"
#   Purchases a pet for the player. Deducts cost using the specified
#   currency. The pet_id must match a filename in the pets/ folder.
#   If the player already owns this pet, they see an "ALREADY ADOPTED"
#   label instead and the purchase is blocked.
#   Examples:
#     action: "buy wealthy_blaze"  → Buys the wealthy_blaze pet
#     action: "buy swift_parrot"   → Buys the swift_parrot pet
#     action: "buy cosmic_bee"     → Buys the cosmic_bee pet
#
# "addxp <active|pet_id> <amount>"
#   Adds XP to a pet. Deducts cost using the specified currency.
#   Use "active" to target the player's currently summoned pet.
#   Examples:
#     action: "addxp active 1000"        → +1,000 XP to active pet
#     action: "addxp wealthy_blaze 5000" → +5,000 XP to specific pet
#
# "buy_level <pet_id> <cost>"
#   Buys one level for a specific pet. Used in the upgrade detail menu.
#   Plays a level-up "ting" sound and refreshes the GUI.
#   Example:
#     action: "buy_level wealthy_blaze 100"
#
# "upgrade_limit <new_limit> [cost]"
#   Upgrades the player's maximum pet storage capacity.
#   Grants the permission rzxpets.limit.<new_limit> via LuckPerms.
#   Examples:
#     action: "upgrade_limit 2"      → Expand to 2 pets, default cost
#     action: "upgrade_limit 3 400"  → Expand to 3 pets, costs 400
#
# "dismiss"
#   Despawns/dismisses the player's currently active pet.
#   Example:
#     action: "dismiss"
#
# "summon <pet_id>"
#   Summons a specific pet for the player (from storage menu clicks).
#   Example:
#     action: "summon swift_parrot"
#
# ─────────────────────────────────────────────────────────────────────
# =====================================================================
items:

  # --- Example: Buy a pet with zGems currency ---
  'buy_blaze':
    material: BLAZE_SPAWN_EGG
    slot: 11
    name: "&#FFAA00&lWealthy Blaze Pet &7[Tier I]"
    lore:
      - "&7A fire companion that generates currency!"
      - "&8&m-------------------------------------"
      - "&7Booster: &b+15% chance to find zGems"
      - "&7when mining valuable ores or killing mobs."
      - "&8&m-------------------------------------"
      - "&7Price: &a500 zGems"
      - "&7Your Balance: &f%excellenteconomy_balance_zgems%"
      - "&8&m-------------------------------------"
      - "&a▸ Click to adopt pet!"
    price: 500
    currency: "zGems"
    action: "buy wealthy_blaze"

  # --- Example: Buy a pet with vanilla items ---
  'buy_bee':
    material: BEE_SPAWN_EGG
    slot: 13
    name: "&#FFDD00&lCosmic Bee Pet &7[Special]"
    lore:
      - "&7A rare cosmic bee companion."
      - "&8&m-------------------------------------"
      - "&7Price: &a10 Emeralds (Vanilla Item)"
      - "&8&m-------------------------------------"
      - "&a▸ Click to adopt pet!"
    price: 10
    currency: "item"
    item-id: "vanilla:EMERALD"
    action: "buy cosmic_bee"

  # --- Example: Buy XP for active pet ---
  'buy_xp':
    material: EXPERIENCE_BOTTLE
    slot: 15
    name: "&d&lBuy +1,000 Pet XP"
    lore:
      - "&7Instantly gives 1,000 experience points"
      - "&7to your currently active summoned pet!"
      - "&8&m-------------------------------------"
      - "&7Price: &a500 zGems"
      - "&7Your Balance: &f%excellenteconomy_balance_zgems%"
      - "&8&m-------------------------------------"
      - "&eClick to buy XP!"
    price: 500
    currency: "zGems"
    action: "addxp active 1000"

  # --- Example: Storage limit upgrade ---
  'upgrade_storage':
    material: CHEST
    slot: 29
    name: "&b&lStorage Expansion &7[3 Pets]"
    lore:
      - "&7Expands your pet storage capacity."
      - "&7Allows you to keep &b3 pets &7total."
      - "&8&m-------------------------------------"
      - "&7Upgrade Cost: &e400 zGems"
      - "&7Your Balance: &f%excellenteconomy_balance_zgems%"
      - "&8&m-------------------------------------"
      - "&eClick to purchase upgrade!"
    price: 400
    currency: "zGems"
    action: "upgrade_limit 3 400"

  # --- Example: Dismiss active pet button ---
  'dismiss_pet':
    material: BARRIER
    slot: 31
    name: "&c&lDismiss Active Pet"
    lore:
      - "&7Despawns your active pet and"
      - "&7disables its booster effects."
      - "&8&m-------------------------------------"
      - "&cClick to dismiss pet"
    price: 0
    currency: "free"
    action: "dismiss"

  # --- Example: Navigation back button ---
  'nav_back':
    material: PAPER
    slot: 40
    name: "&c&l« Go Back"
    lore:
      - "&7Return to the main pet menu."
    price: 0
    currency: "free"
    action: "open main"


# =====================================================================
# TIPS & BEST PRACTICES
# =====================================================================
#
# 1. MULTIPLE SECTIONS: Create as many section files as you want.
#    Each one becomes its own menu screen. Link between them using
#    the "open <section_id>" action.
#
# 2. ORGANIZED SHOPS: Split pets into categories like "combat_shop",
#    "farming_shop", "vip_shop" for cleaner organization.
#
# 3. PLACEHOLDERS: Use %excellenteconomy_balance_zgems% to show
#    the player's current balance on purchase items.
#
# 4. ADOPTED LABELS: When a player already owns a pet listed with
#    a "buy <pet_id>" action, the plugin automatically:
#      - Appends a green "[Adopted]" tag to the item name
#      - Replaces "Click to adopt" text with "● ALREADY ADOPTED"
#
# 5. SLOT PLANNING: Use the slot reference chart above to plan
#    your layout on paper before configuring. Center important
#    items and place navigation on the bottom row.
#
# 6. COLOR CODES: Use & for standard codes, &#RRGGBB for hex.
#    Bold: &l | Italic: &o | Underline: &n | Strike: &m | Reset: &r
#    Colors: &0-&f (black through white)
#
# =====================================================================
