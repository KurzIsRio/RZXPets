# Farmer Allay Pet Configuration
enabled: true
name: "&bFarmer Allay"
entity-type: ALLAY

# Optional: set custom texture model id for inventory menus
custom-model-data: 0

mechanics:
  - type: command-trigger
    trigger: BLOCK_BREAK
    name: "&d&lFarmer's Helper"
    description:
      - "&7Break crops to earn bonus Hoe XP"
      - "&7for your AxHoes tools."
      - "&7Trigger Chance: &a100% (Guaranteed)"
      - "&7Bonus Hoe XP: &b+%player_pet_level_additional% XP"
      - "&7(Accumulates over 50 crop breaks)"
    chance: 1.0
    level-modifier: 0.0
    base-additional: 5
    base-multiplier: 1.0
    multiplier-level-modifier: 0.02
    accumulate-count: 50
    command: "axhoes givexp %player% %player_pet_level_additional%"
    message: "%name% &7» &fAxHoes Hoe XP boosted by +%player_pet_level_additional%! &7(Companion harvested %count% crops)"
    min-level: 1
    blocks:
      - WHEAT
      - CARROTS
      - POTATOES
      - BEETROOTS
      - NETHER_WART
      - MELON
      - PUMPKIN
      - COCOA
      - SUGAR_CANE
  - type: area-heal
    name: "&b&lSoothing Symphony"
    description:
      - "&7Heals you and nearby players periodically."
      - "&7Heal Amount: &f%heal% HP"
      - "&7Radius: &f%radius% blocks"
      - "&7Cooldown: &f%cooldown%s"
    min-level: 60
    base-heal: 1.0
    heal-modifier: 0.04
    radius: 3.0
    base-cooldown: 40.0
    cooldown-modifier: 0.15

  - type: command-trigger
    trigger: SUMMON
    name: "Summon Greetings"
    description:
      - "&7Sends welcome message on companion spawn."
    command: ""
    message: "%pet_name% &7» &eAllay equipped! Harvest crops for extra Hoe XP."
    min-level: 1
  - type: command-trigger
    trigger: DISMISS
    name: "Dismiss Status"
    description:
      - "&7Sends unequip message on companion despawn."
    command: ""
    message: "%pet_name% &7» &eAllay unequipped."
    min-level: 1
