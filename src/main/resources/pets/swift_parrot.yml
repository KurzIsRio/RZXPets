# Swift Parrot Pet Configuration
enabled: true
name: "&aSwift Parrot"
entity-type: PARROT

# Parrot entity color variant (options: RED, BLUE, GREEN, CYAN, GRAY)
variant: CYAN

# Optional: set custom texture model id for inventory menus
custom-model-data: 0

mechanics:
  - type: potion
    name: "&a&lWind Run Booster"
    description:
      - "&7Grants permanent Speed effects while equipped."
      - "&7Scales up smoothly every 20 levels."
    effect: SPEED
    amplifier: 0
    min-level: 1
    # Progressive upgrade milestones
    progressive-levels:
      20:
        amplifier: 1
      40:
        amplifier: 2
      60:
        amplifier: 3
      80:
        amplifier: 4
      100:
        amplifier: 5
  - type: double-drops
    name: "&a&lWind Fall Harvest"
    description:
      - "&7Chance to double block drops when harvesting crops."
      - "&7Current Chance: &f%chance%%"
    min-level: 50
    base-chance: 0.05
    level-modifier: 0.002
    blocks:
      - WHEAT
      - CARROTS
      - POTATOES
      - BEETROOTS
      - NETHER_WART
  - type: command-trigger
    trigger: SUMMON
    name: "Summon Greetings"
    description:
      - "&7Sends welcome message on companion spawn."
    command: ""
    message: "&a&l[Swift Parrot] &eParrot equipped! Permanent Speed applied."
    min-level: 1
  - type: command-trigger
    trigger: DISMISS
    name: "Dismiss Status"
    description:
      - "&7Sends unequip message on companion despawn."
    command: ""
    message: "&7&l[Swift Parrot] &eParrot unequipped."
    min-level: 1
