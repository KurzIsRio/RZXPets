# Majestic Bat Pet Configuration
enabled: true
name: "&d&lMajestic Bat Pet"
entity-type: BAT
mechanics:
  - type: lifesteal
    name: "&d&lVampiric Echolocation"
    description:
      - "&7Chance to heal back a portion of damage dealt."
      - "&7Current Chance: &f%chance%%"
      - "&7Heal Ratio: &f%percent%%"
    min-level: 1
    base-chance: 0.10
    level-modifier: 0.002
    base-percent: 0.05
    percent-modifier: 0.0015
  - type: potion
    name: "&d&lSonar Vision"
    description:
      - "&7Grants permanent Night Vision while equipped."
    effect: NIGHT_VISION
    amplifier: 0
    min-level: 30
  - type: command-trigger
    trigger: SUMMON
    name: "Summon Sound"
    description:
      - "&7Plays bat take-off sound on spawn."
    command: "playsound minecraft:entity.bat.takeoff ambient %player%"
    message: "%pet_name% &7» &eBat equipped! Vampiric Echolocation active."
    min-level: 1
  - type: command-trigger
    trigger: DISMISS
    name: "Dismiss Sound"
    description:
      - "&7Plays bat ambient sound on unequip."
    command: "playsound minecraft:entity.bat.ambient ambient %player%"
    message: "%pet_name% &7» &eBat unequipped."
    min-level: 1
