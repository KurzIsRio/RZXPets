name: RZXPets
version: 1.0.0
main: com.rzxpets.RZXPets
depend: [RZXCore]
softdepend: [PlaceholderAPI, WorldGuard, ExcellentEconomy, LuckPerms, Oraxen, ItemsAdder]
api-version: '1.20'
author: Antigravity
description: Custom companion pets plugin integrated with RZXCore specifications.

commands:
  rzxpets:
    description: Core RZXPets admin command.
    permission: rzxpets.admin
    usage: /rzxpets <buy|addxp|summon|dismiss|reload> [player] [type/amount]
    aliases: [rzxpet]
  pets:
    description: Open the Pet Upgrades & Storage Limits Menu.
    usage: /pets
    aliases: [pet]
  petshop:
    description: Open the Pet Adoption Shop.
    usage: /petshop
    aliases: [pshop]
  petstorage:
    description: Open your personal Pet Storage menu to summon or dismiss pets.
    usage: /petstorage
    aliases: [pstorage, storage]
