# =====================================================================
#             RZXPets - Global Plugin Configuration
# =====================================================================

# Database Storage Settings
# Enables syncing player profiles across multiple servers on a network.
# Supported database types: SQLite (local file) or MySQL (external server).
database:
  type: "SQLite"
  
  sqlite:
    file: "rzxpets.db"
    
  mysql:
    host: "localhost"
    port: 3306
    database: "rzxpets"
    username: "root"
    password: "password"
    ssl: false

# Normal playtime rewards system (active everywhere except the AFK Arena)
playtime-rewards:
  enabled: true
  # Reward interval in minutes
  interval-minutes: 20
  # Console command to execute. Supports %player%
  command: "zgems give %player% 2 -s"
  # Message sent to player (Supports '&' color codes). Set to "" to disable message.
  message: "&a&l[Playtime] &eYou received &d2 zGems &efor playing for 20 minutes!"

# AFK Arena rewards system (only active when standing inside the specified WorldGuard region)
afk-arena-rewards:
  enabled: true
  # The WorldGuard region ID for your AFK Arena
  region-name: "afk_arena"
  # Reward interval in minutes
  interval-minutes: 40
  # Console command to execute. Supports %player%
  command: "zgems give %player% 2 -s"
  # Message sent to player (Supports '&' color codes). Set to "" to disable message.
  message: "&a&l[AFK Arena] &eYou received &d2 zGems &efor staying in the AFK Arena for 40 minutes!"

# Storage settings
storage:
  # The default number of pets a player can own without any rzxpets.limit.X permission
  default-limit: 1

# Edition & License Settings
# Set premium to true to enable Premium features locally, or use licensing server verification!
# If false (Standard Edition), plugin will enforce max 5 registered pet types and max 10 mechanics limit.
edition:
  premium: true
  standard-max-pets: 5
  standard-max-mechanics: 10

# License Verification Server Settings
# Connects to your Python Discord License Bot server to verify active license keys online.
licensing:
  enabled: true
  server-url: "http://127.0.0.1:8080/api/v1/verify"
  license-key: "RZXP-PREM-8F92-3K1L"
  timeout-seconds: 5
  # Enable grace period cache so plugin stays in verified state during short bot restarts
  grace-period-hours: 24

# Pet Renaming Settings
renaming:
  # Maximum length of custom pet names (excluding color prefixes)
  max-length: 32

# Follow Mechanics Settings
follow:
  # Distance in blocks between player and pet before the pet instantly teleports to the player
  teleport-distance: 15.0

# Debug Settings
# If enabled, detailed debug logs will be sent to the console.
# Set debug level (0 = disabled, 1 = basic warning/error logs, 2 = full gameplay triggers debug logs).
debug-level: 0
