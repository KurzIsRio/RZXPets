# =====================================================================
#             RZXPets - Global Plugin Configuration
# =====================================================================

# Database Storage Settings
# Enables syncing player profiles across multiple servers on a network.
# Supported database types: SQLite (local file) or MySQL (external server).
database:
  type: "SQLite"
  
  sqlite:
    file: "rzxpets.db"
    
  mysql:
    host: "localhost"
    port: 3306
    database: "rzxpets"
    username: "root"
    password: "password"
    ssl: false

# Normal playtime rewards system (active everywhere except the AFK Arena)
playtime-rewards:
  enabled: true
  # Reward interval in minutes
  interval-minutes: 20
  # Console command to execute. Supports %player%
  command: "zgems give %player% 2 -s"
  # Message sent to player (Supports '&' color codes). Set to "" to disable message.
  message: "&a&l[Playtime] &eYou received &d2 zGems &efor playing for 20 minutes!"

# AFK Arena rewards system (only active when standing inside the specified WorldGuard region)
afk-arena-rewards:
  enabled: true
  # The WorldGuard region ID for your AFK Arena
  region-name: "afk_arena"
  # Reward interval in minutes
  interval-minutes: 40
  # Console command to execute. Supports %player%
  command: "zgems give %player% 2 -s"
  # Message sent to player (Supports '&' color codes). Set to "" to disable message.
  message: "&a&l[AFK Arena] &eYou received &d2 zGems &efor staying in the AFK Arena for 40 minutes!"

# Storage settings
storage:
  # The default number of pets a player can own without any rzxpets.limit.X permission
  default-limit: 1

# Pet Renaming Settings
renaming:
  # Maximum length of custom pet names (excluding color prefixes)
  max-length: 32

# Follow Mechanics Settings
follow:
  # Distance in blocks between player and pet before the pet instantly teleports to the player
  teleport-distance: 15.0
