# =====================================================================
#              RZXPets - EXAMPLE PET CONFIGURATION (REFERENCE)
# =====================================================================
#
# This file is a COMPLETE reference guide explaining every configurable
# option available when creating custom pet companions in RZXPets.
#
# HOW TO CREATE A NEW PET:
#   1. Copy this file and rename it (e.g. "my_cool_pet.yml").
#   2. The filename (without .yml) becomes the pet's internal ID used
#      in commands. Example: "my_cool_pet.yml" → ID = "my_cool_pet"
#      Usage: /rzxpets give <player> my_cool_pet
#   3. Set "enabled: true" to register it.
#   4. Add it to your shop section YAML so players can buy it:
#      action: "buy my_cool_pet"
#   5. Reload with /rzxpets reload.
#
# IMPORTANT: This file is set to "enabled: false" so it will NOT
# register as an actual pet. It exists purely as documentation.
#
# =====================================================================

# =====================================================================
# BASIC SETTINGS
# =====================================================================

# Whether this pet type is registered and loaded by the plugin.
# Set to false to disable without deleting the file.
enabled: false

# Display name of the pet shown in menus, nametags, and chat messages.
# Supports standard Minecraft color codes (&a, &b, &l, etc.)
# and hex RGB codes (&#FF5500, &#00FFCC, etc.).
#
# The LEADING color/style codes in this name are automatically
# preserved when a player renames the pet via /pets rename.
# Example: "&#FF5500&l" prefix will carry over to custom names.
#
# Examples:
#   name: "&aSwift Parrot"           → Green text
#   name: "&d&lMajestic Bat Pet"     → Light purple + bold
#   name: "&#FFAA00&lWealthy Blaze"  → Orange hex + bold
#   name: "&#00E1FF&lFrost Fox"      → Cyan hex + bold
name: "&#FF5500&lMythic Fire Dragon"


# The Bukkit/Spigot EntityType to spawn as the companion entity.
# This determines the mob model that appears next to the player.
#
# The entity will have:
#   - AI disabled (no wandering/roaming)
#   - Invulnerability enabled (cannot be killed)
#   - Silent mode enabled (no ambient sounds)
#   - Collision disabled (won't push players)
#   - Gravity disabled (floats at shoulder height)
#
# Common EntityTypes:
#   BLAZE, BAT, ALLAY, PARROT, BEE, CHICKEN, WOLF, CAT, FOX,
#   AXOLOTL, RABBIT, FROG, STRIDER, VEX, SNOW_GOLEM, IRON_GOLEM,
#   ZOMBIE, SKELETON, CREEPER, SPIDER, ENDERMITE, SILVERFISH,
#   LLAMA, PIG, COW, SHEEP, HORSE, DOLPHIN, TURTLE, PANDA, OCELOT
#
# SPECIAL NOTES:
#   - BAT entities are automatically forced into "awake" flying state
#     so they flap their wings instead of hanging upside down.
#   - PARROT entities support a "variant" option (see below).
entity-type: BLAZE

# (PARROT ONLY) Sets the color variant of the parrot entity.
# Only applies when entity-type is PARROT. Ignored for other types.
#
# Valid options: RED, BLUE, GREEN, CYAN, GRAY
# Default: CYAN (if not specified or invalid)
#
# variant: CYAN

# Custom Model Data value for inventory item displays.
# Used with resource packs to show custom textures on spawn egg items
# in shop/storage GUIs.
# Set to 0 to use default textures.
custom-model-data: 0


# =====================================================================
# MECHANICS (ABILITIES & BOOSTERS)
# =====================================================================
#
# Mechanics define what the pet actually DOES for the player.
# Each mechanic is an entry in the "mechanics" list below.
#
# There are 3 mechanic types:
#   1. "potion"           → Grants permanent potion effects
#   2. "flight"           → Grants creative-mode flight
#   3. "command-trigger"  → Runs console commands on events
#
# All mechanics share these common fields:
#   - type: (required) The mechanic type string.
#   - min-level: (required) Minimum pet level to activate this mechanic.
#     Set to 1 to make it available immediately.
#   - name: (optional) Custom display name of this skill in player menus.
#   - description: (optional) Multi-line list of strings describing this skill.
#
# =====================================================================
mechanics:

  # ===================================================================
  # MECHANIC TYPE: "potion"
  # ===================================================================
  # Grants a permanent potion effect to the owner while the pet is
  # summoned/active. The effect is automatically removed when the pet
  # is dismissed or the player logs out.
  #
  # Fields:
  #   effect:    (required) The PotionEffectType name.
  #   amplifier: (required) Effect strength. 0 = Level I, 1 = Level II, etc.
  #   min-level: (required) Pet level required to unlock.
  #
  # Common PotionEffectTypes:
  #   SPEED, SLOW, HASTE, MINING_FATIGUE, STRENGTH (or INCREASE_DAMAGE),
  #   INSTANT_HEALTH, INSTANT_DAMAGE, JUMP_BOOST (or JUMP), NAUSEA,
  #   REGENERATION, RESISTANCE (or DAMAGE_RESISTANCE), FIRE_RESISTANCE,
  #   WATER_BREATHING, INVISIBILITY, NIGHT_VISION, HUNGER, WEAKNESS,
  #   POISON, WITHER, HEALTH_BOOST, ABSORPTION, SATURATION, GLOWING,
  #   LUCK, UNLUCK, SLOW_FALLING, CONDUIT_POWER, DOLPHINS_GRACE
  #
  # PROGRESSIVE UPGRADES:
  #   You can scale the amplifier at higher pet levels using
  #   "progressive-levels". See the example below.
  # ===================================================================

  # Example 1: Speed boost, upgrades at higher levels
  - type: potion
    effect: SPEED
    amplifier: 0           # Speed I at base level
    min-level: 1           # Available from level 1
    # Progressive level milestones (optional).
    # When the pet reaches these levels, the amplifier is upgraded.
    # The plugin picks the highest milestone <= current pet level.
    progressive-levels:
      30:
        amplifier: 1       # Speed II at level 30+
      70:
        amplifier: 2       # Speed III at level 70+

  # Example 2: Strength boost unlocked at level 50
  - type: potion
    effect: INCREASE_DAMAGE
    amplifier: 0           # Strength I
    min-level: 50          # Unlocks at level 50


  # ===================================================================
  # MECHANIC TYPE: "flight"
  # ===================================================================
  # Grants creative-mode flight to the player while the pet is active.
  # Flight is automatically revoked when the pet is dismissed, the
  # player logs out, or the player enters a WorldGuard blocked region.
  #
  # Fields:
  #   min-level: (required) Pet level required to unlock flight.
  #
  # NOTES:
  #   - Only one flight mechanic per pet is needed.
  #   - Flight is checked every tick; if the pet despawns, flight stops.
  #   - WorldGuard blocked-regions in hooks.yml will disable flight.
  # ===================================================================

  # Example: Flight unlocked at level 100
  - type: flight
    min-level: 100


  # ===================================================================
  # MECHANIC TYPE: "command-trigger"
  # ===================================================================
  # Executes a console command and/or sends a chat message to the player
  # when a specific gameplay event fires.
  #
  # Fields:
  #   trigger:   (required) The event type. Valid values:
  #                SUMMON      → Pet is summoned/equipped by the player
  #                DISMISS     → Pet is dismissed/despawned
  #                BLOCK_BREAK → Player breaks a block
  #                MOB_KILL    → Player kills a mob
  #   chance:    (optional) Probability 0.0-1.0. Default: 1.0 (100%).
  #                Example: 0.15 = 15% chance to fire.
  #   command:   (optional) Console command to execute. Set to "" to skip.
  #                Supports placeholder: %player% → player's name.
  #   message:   (optional) Chat message sent to the player. Set to "" to skip.
  #                Supports '&' color codes and hex codes.
  #   min-level: (required) Minimum pet level to activate.
  #
  # BLOCK_BREAK-SPECIFIC FIELDS:
  #   blocks:    (optional) List of Material names that can trigger this.
  #                If omitted, ALL block types will trigger it.
  #                Use Spigot Material names (e.g. DIAMOND_ORE, WHEAT).
  #
  # MOB_KILL-SPECIFIC FIELDS:
  #   mobs:      (optional) List of EntityType names that can trigger this.
  #                If omitted, ALL mob types will trigger it.
  #                Use Spigot EntityType names (e.g. ZOMBIE, SKELETON).
  #
  # PROGRESSIVE UPGRADES:
  #   You can scale chance, command, and message at higher pet levels
  #   using "progressive-levels". The plugin picks the highest milestone
  #   that is <= the pet's current level.
  # ===================================================================

  # --- SUMMON event: Fires when the pet is equipped ---
  - type: command-trigger
    trigger: SUMMON
    chance: 1.0            # Always fires (100%)
    command: "effect give %player% fire_resistance 30 1 true"
    message: "&#FF5500&l[Dragon] &eEquipped! Granted temporary Fire Resistance."
    min-level: 1

  # --- DISMISS event: Fires when the pet is unequipped ---
  - type: command-trigger
    trigger: DISMISS
    chance: 1.0
    command: ""             # No command, just a message
    message: "&7&l[Dragon] &eReturned to storage."
    min-level: 1

  # --- BLOCK_BREAK event: Mining booster with progressive upgrades ---
  - type: command-trigger
    trigger: BLOCK_BREAK
    chance: 0.05           # 5% chance at base level
    command: "zgems give %player% 1 -s"
    message: "&#FF5500&l[Dragon] &fFound 1 zGem while mining!"
    min-level: 1
    # Progressive level milestones:
    # At each milestone, the chance, command, and message are replaced
    # with upgraded versions. Only the fields you specify are overridden.
    progressive-levels:
      30:                  # At level 30+
        chance: 0.15       # Upgraded to 15% chance
        command: "zgems give %player% 1 -s"
        message: "&#FF5500&l[Dragon] &fFound 1 zGem while mining!"
      70:                  # At level 70+
        chance: 0.25       # Upgraded to 25% chance
        command: "zgems give %player% 2 -s"
        message: "&#FF5500&l[Dragon] &fFound 2 zGems while mining!"
      100:                 # At level 100+
        chance: 0.35       # Upgraded to 35% chance
        command: "zgems give %player% 5 -s"
        message: "&#FF5500&l[Dragon] &fFound 5 zGems while mining!"
    # Only these block types trigger the event:
    blocks:
      - COAL_ORE
      - DEEPSLATE_COAL_ORE
      - IRON_ORE
      - DEEPSLATE_IRON_ORE
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - REDSTONE_ORE
      - DEEPSLATE_REDSTONE_ORE
      - LAPIS_ORE
      - DEEPSLATE_LAPIS_ORE
      - NETHER_QUARTZ_ORE
      - NETHER_GOLD_ORE
      - STONE
      - DEEPSLATE

  # --- MOB_KILL event: Combat booster with progressive upgrades ---
  - type: command-trigger
    trigger: MOB_KILL
    chance: 0.20           # 20% chance
    command: "xp give %player% 50 points"
    message: "&#FF5500&l[Dragon] &fAbsorbed the soul of the mob! &b+50 XP&f."
    min-level: 25          # Unlocked at level 25
    progressive-levels:
      50:
        chance: 0.30
        command: "xp give %player% 100 points"
        message: "&#FF5500&l[Dragon] &fAbsorbed the soul of the mob! &b+100 XP&f."
      100:
        chance: 0.40
        command: "xp give %player% 200 points"
        message: "&#FF5500&l[Dragon] &fAbsorbed the soul of the mob! &b+200 XP&f."
    # Only these mob types trigger the event:
    mobs:
      - ZOMBIE
      - SKELETON
      - CREEPER
      - SPIDER
      - ENDERMAN
      - WITCH
      - BLAZE
      - WITHER_SKELETON


# =====================================================================
# QUICK REFERENCE: PET LEVEL SYSTEM
# =====================================================================
#
# Pets gain XP through:
#   - Admin commands: /rzxpets addxp <player> <pet_type> <amount>
#   - Shop GUI purchases (upgrade.yml XP items)
#   - Any custom mechanic you wire up via command-trigger
#
# XP required per level: level * 100
#   Level 1 → 2:    100 XP
#   Level 2 → 3:    200 XP
#   Level 10 → 11:  1,000 XP
#   Level 50 → 51:  5,000 XP
#   Level 100 → 101: 10,000 XP
#
# Players can upgrade pet levels with zGems via the upgrade detail
# menu (opened from /pets → select pet → buy level).
#
# The nametag above the entity automatically updates with the level:
#   Example: "&#FF5500&lMythic Fire Dragon &7[Lvl 42]"
#
# =====================================================================

# =====================================================================
# QUICK REFERENCE: ADMIN COMMANDS
# =====================================================================
#
# /rzxpets give <player> <pet_id>     → Grant a specific pet
# /rzxpets give <player> all          → Grant all pets
# /rzxpets give all <player>          → Grant all pets (alt syntax)
# /rzxpets remove <player> <pet_id>   → Revoke a specific pet
# /rzxpets remove <player> all        → Revoke all pets
# /rzxpets remove all <player>        → Revoke all pets (alt syntax)
# /rzxpets addxp <player> <pet> <amt> → Add XP to a pet
# /rzxpets summon <player> <pet_id>   → Force-summon a pet
# /rzxpets dismiss <player>           → Force-dismiss active pet
# /rzxpets rename <player> <pet> <name> → Admin rename
# /rzxpets reload                     → Reload all configs
#
# =====================================================================
